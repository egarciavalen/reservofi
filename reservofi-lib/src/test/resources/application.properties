# Configuraciones base de datos de prueba h2
# URL
spring.datasource.url=jdbc:h2:mem:testdb
# Driver
spring.datasource.driverClassName=org.h2.Driver
# Credenciales
spring.datasource.username=sa
spring.datasource.password=password
# Habilitar consola web
spring.h2.console.enabled=true
# Crear tablas antes de insertar datos
spring.jpa.defer-datasource-initialization=true
#~Modificar las tablas creadas según las entidades
spring.jpa.hibernate.ddl-auto=update
# Nombre de la aplicación
spring.application.name=reservofi
# Token seguridad jwt (formato HMAC de 256 bits)
token.security.secret.key=49d65e847f2b4fa28728b368ec96b50d489487e1469c48d97034c8626d67b50f
token.security.expiration=3600000